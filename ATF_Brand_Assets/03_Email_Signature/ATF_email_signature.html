<!--
  ATF email signature template
  1. Upload ATF_signature_wide_applied_300px@2x.png to the website (e.g. /brand/) and replace LOGO_URL below.
     Email clients need the logo hosted at a public https:// URL. Do not use SVG (Outlook and Gmail block it).
  2. Replace the [bracketed] details.
  3. Open this file in a browser, select all (Ctrl/Cmd+A), copy, and paste into
     Outlook: Settings > Accounts > Signatures  |  Gmail: Settings > General > Signature
  Fonts: Arial only, the one font every email client and device has.
-->

  </tr>

  </tr>
